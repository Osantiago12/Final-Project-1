<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Grocery List</title>
        <style>
            *{
                padding: 0px;
                margin: 0px;
                box-sizing: border-box;
            }

            body{
                background-color: rgb(0, 0, 15);
                color: aquamarine;
                text-align: center;
            }
            
            header{
                height: 300px;
                background-image: url(https://th.bing.com/th/id/OIP.XggwJouHK7GrUFURi5bmEwHaE4?w=296&h=194&c=7&r=0&o=7&dpr=1.1&pid=1.7&rm=3);
                background-size: cover;
                background-position: 10px -60px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            h1{
                opacity: 1.5;
                font-size: 64px;
                margin: auto;
                padding: 50px;
                height: 100%;
                width: 100%;
                background-color: rgba(0, 0, 0, 0.6);
            }

            h2{
                font-size: 46px;
                margin-top: 80px;
            }

            input{
                font-size: 40px;
                background-color: rgb(0, 0, 15);
                border: 10px aquamarine solid;
                border-radius: 20px;
                color: aquamarine;
                padding: 2px 10px;
                width: 75%;
                margin: 40px;
            }

            input:focus{
                background-color: aquamarine;
                color: rgb(0, 0, 15);
                border: 10px rgb(0, 0, 15) solid;
            }

            button{
                font-size: 24px;
                color: aquamarine;
                background-color: rgb(0, 0, 15);
                border: 5px solid aquamarine;
                border-radius: 40px;
                padding: 5px 10px;
                margin: 20px;
            }

            button:hover{
                color: rgb(0, 0, 15);
                background-color: aquamarine;
            }

            #listsection{
                background-color: rgb(0, 0, 15);
            }

            #listContainer{
                color: aquamarine;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .listrow{
                display: flex;
                flex-direction: row;
                flex-wrap: nowrap;
                align-items: center;
                justify-content: center;
                width: 100%;
            }
           
            p{
                font-size: 36px;
            }

            .gap{
                width: 20%;
                height: 2px;
            }

            @media (min-width:1000px) {
                header{
                    height: 600px;
                }
                h1{
                    padding: 10%;
                }
                input{
                    width: 40%;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Grocery List <br >Manager</h1>
        </header>
        <div>
            <h2>Add Grocery</h2>
            <input type="text" id="grocery"> 
            <br>
            <button onclick="addGrocery(this)">Add Item</button>
        </div>
        
        
        <div id="listsection">
            <h2>View List</h2>
            <div id="listContainer">
                <div class="listrow">
                    <p>1. Banana</p><span class="gap"></span><BUTTON onclick="purchased()">Purchased</BUTTON>
                </div>
                <button onclick="clear()">Clear List</button>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
